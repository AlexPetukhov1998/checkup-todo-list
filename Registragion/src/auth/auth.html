<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../style.css" />
        <title>Форма регистрации</title>
    </head>
    <body>
        <header>
            <nav class="nav">
                <div class="logo-container">
                    <img class="logo" src="../photo/ai.jpg" alt="Логотип" />
                </div>
                <ul class="nav-buttons">
                    <li><a href="#">Ваши задачи</a></li>
                    <li><a href="#">Заметки</a></li>
                    <li><a href="#">Календарь</a></li>
                    <li><a href="#">Здесь строка поиска</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <form class="auth-form">
                <h2>Авторизация на сайте</h2>
                <input
                    type="email"
                    class="input"
                    id="login"
                    placeholder="Логин"
                    required
                />
                <input
                    type="password"
                    class="input"
                    name="password"
                    id="password"
                    placeholder="Пароль"
                    required
                />
                <button id="enter">Авторизоваться</button>
                <button id="reg">Зарегистрироваться</button>
            </form>
        </main>
        <footer class="footer">
            <div class="footer__content">
                <p>Автор Петухов А.В.</p>
                <p>Сайт создан в качестве тренировачного проекта</p>
                <address>
                    <p>
                        Email:
                        <a href="mailto:hedin2014@mail.ru">hedin2014@mail.ru</a>
                    </p>
                    <p>
                        Телефон: <a href="tel:+79823689248">+7-982-368-92-48</a>
                    </p>
                </address>
            </div>
        </footer>
        <script src="auth.js" defer></script>
    </body>
</html>
