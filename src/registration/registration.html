<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="registration.js"></script>
    <link rel="stylesheet" href="../style.css">
    <title>Форма регистрации</title>
</head>
<body>
    <header>
        <nav class="nav">
            <div class="logo-container">
                <img class="logo" src="../photo/ai.jpg" alt="Логотип" style="width: 8vw; height: auto;">
                <!-- <img class="logo" src="../photo/i.webp" alt="Логотип" style="width: 6vw; height: auto;"> -->

            <div class="nav-buttons">
                <button>Ваши задачи</button>

                <button>Календарь</button>
                <button>Здесь строка поиска</button>

        </nav>
    </header>
    <main>
        <section class="auth-form" >
            <h1> Регистрация </h1>
            <input type="email" class="input" name="login" id="login" placeholder="Логин">
            <input type="password" class="input" name="password" id="password" placeholder="Пароль">
            <button id="enter"> Зарегистрироваться </button>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <p>Автор Петухов А.В.</p>

        </div>
