<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <script src="auth.js" defer></script>
    <title>Форма регистрации</title>
</head>
<body>
    <header>
        <nav class="nav">
            <div class="logo-container">
                <img class="logo" src="../photo/ai.jpg" alt="Логотип" style="width: 8vw; height: auto;">
                <!-- <img class="logo" src="../photo/i.webp" alt="Логотип" style="width: 6vw; height: auto;"> -->
            </div>
            <div class="nav-buttons">
                <button>Ваши задачи</button>
                <button>Заметки</button>
                <button>Календарь</button>
                <button>Здесь строка поиска</button>
            </div>
        </nav>
    </header>
    <main class="auth-form">
        <h1>Авторизация на сайте</h1>
        <input type="email" class="input" id="login" placeholder="Логин" required>
        <input type="password" class="input" name="password" id="password" placeholder="Пароль" required>
        <button id="enter">Авторизоваться</button>
        <button id="reg" style="margin-top: 2vh;">Зарегистрироваться</button>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <p>Автор Петухов А.В.</p>
            <p>Сайт создан в качестве тренировачного проекта</p>
            <p>Email: hedin2014@mail.ru</p>
            <p>Телефон: +7-982-368-92-48</p>
        </div>
    </footer>
</body>
</html>
